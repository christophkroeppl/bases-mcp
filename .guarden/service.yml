# Guarden service manifest for bases-mcp.
#
# Serves the MCP Streamable HTTP transport at http://HOST:PORT/mcp — the same
# binary an agent spawns over stdio, wrapped in a listener so several agents can
# share one vault. The vault is configured by the environment; see
# `.guarden/.env.schema`.
#
# Security: the listener is network-accessible and unauthenticated, and the
# network is assumed safe. That is a recorded, accepted gap — see
# docs/BACKLOG-network-security.md and docs/divergences.md.

project: bases-mcp

units: compose.yaml

schema: .guarden/.env.schema

routes:
  # The container's own port; guarden allocates the loopback publication and
  # the edge dials it. `host:` is a label, not a domain: the full name is the
  # track's host_prefix plus this.
  - container: bases-mcp
    port: 8765
    host: bases-mcp
